<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BingeBox</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
    <script src="Browse.js" defer></script>
    <script
      src="https://kit.fontawesome.com/efcd89efa5.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="page-2__body">
        <div id="search__nav--bar" class="overlay">  
       <nav class="search__nav">
          <div class="logo">
            <i class="fa-solid fa-video nav__logo"></i>
            <h1 class="nav__title">BingeBox</h1>
          </div>
          <ul class="nav__links">
            <li class="nav__link--list nav__link--hide">
              <a href="index.html" class=
              "nav__link 
              nav__link--effect 
              nav__link--effect-purple
              white
              click__effect
              ">Home
            </a>
            </li>
            <li class="nav__link--list nav__link--hide">
              <a
                href="#" class="
                nav__link 
                nav__link--effect 
                nav__link--effect-purple
                white
                click__effect"
                >Find Your Movie
            </a>
            </li>
            <li class="nav__link--list nav__link--hide">
              <a href="#" class=
              "nav__link 
              btn__contact
              click__effect"
              >Contact
            </a>
            </li>
            <li class="nav__link--list" onclick="toggleContrast()">
            <a
              href="#" class="
                nav__link 
                nav__link--effect 
                click__effect
                purple2"                       
            ><i class="fas fa-adjust"></i>      
            </a>
          </li>
          <div class="menu__toggle click__effect" id="menu__toggle">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </div>
          </ul>
           <ul class="nav__menu" id="nav__menu">
            <li class="nav__link 
                nav__link--effect 
                 nav__link--effect-purple
                  ham__hide
                "><a href="index.html"
                >Home</a></li>
            <li class="nav__link 
                nav__link--effect
                 nav__link--effect-purple
                  ham__hide "
                ><a href="Browse.html"
                >Find Your Movie</a></li>
            <li class="nav__link 
                nav__link--effect 
                 nav__link--effect-purple
                  ham__hide
                "><a href="#"
                >Contact</a></li>
          </ul>
        </nav>
          <div class="search__title">Browse Our Movies</div>
             <div class="input__wrapper">
               <input class="input__field"
                type="text" 
                id="destination__input"
                placeholder="Search by Title"
                onchange="changeSearchValue(event)"
                />
               <button class="btn__search" onclick="renderMovies(searchTerm)">
            <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </div>   
        </div>
    <section class="search">
      <div class="search__result--wrapper">
      <h1 class="search__result">Search Result:
        <span class="search__name"></span>
      </h1>
      <button id="sort__button"
      class="sort__by"
      onclick="toggleSortOrder()"
      >Search by:</button>
      </div>
      <div class="movies">
 
      </div>
    </section>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
      AOS.init()
    </script>
  </body>
</html>
