<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BingeBox</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <script src="Browse.js" defer></script>
    <script
      src="https://kit.fontawesome.com/efcd89efa5.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
        <section id="nav__bar">  
       <nav> 
          <div class="logo">
            <i class="fa-solid fa-video nav__logo"></i>
            <h1 class="nav__title">BingeBox</h1>
          </div>
          <ul class="nav__links">
            <li class="nav__link--list nav__link--hide">
              <a href="#" class=
              "nav__link 
              nav__link--effect 
              nav__link--effect-purple
              purple
              click__effect
              ">Home
            </a>
            </li>
            <li class="nav__link--list nav__link--hide">
              <a
                href="Browse.html" class="
                nav__link 
                nav__link--effect 
                nav__link--effect-purple
                click__effect"
                >Find Your Movie
            </a>
            </li>
            <li class="nav__link--list nav__link--hide">
              <a href="#" class=
              "nav__link 
              btn__contact
              click__effect"
              >Contact
            </a>
            </li>
            <li class="nav__link--list nav__link--last" onclick="toggleContrast()">
             <a
               href="#" class="
                 nav__link 
                 nav__link--effect
                 click__effect"                       
             ><i class="fas fa-adjust"></i>   
            </a>
          </li>
          <div class="menu__toggle click__effect" id="menu__toggle">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
          </div>
          </ul>
          <ul class="nav__menu" id="nav__menu">
            <li class="nav__link 
                nav__link--effect 
                 nav__link--effect-purple
                 ham__hide
                "><a href="index.html"
                >Home</a></li>
            <li class="nav__link 
                nav__link--effect
                 nav__link--effect-purple
                  ham__hide "
                ><a href="Browse.html"
                >Find Your Movie</a></li>
            <li class="nav__link 
                nav__link--effect 
                 nav__link--effect-purple
                  ham__hide
                "><a href="#"
                >Contact</a></li>
          </ul>
        </nav>
    </section>
    <section id="landing__page" class="landing__page">
      <div class="content__wrapper">
        <div class="landing__title">
          <h1><span class="purple">America's Top Rated Movie Streaming Service </span></h1>
          <h2 class="para">
            FIND YOUR FILM WITH <span class="purple">BINGEBOX </span> 
          </h2>
        </div>
        <div class="input__wrapper">
          <input class="input__field"
          id="source__input"
           type="text"
            placeholder="Search by Title"
            onchange="setSearchTerm(event)"
            />
          <button class="btn__search click__effect" onclick="goToBrowseMovies()">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>
        <img src="./assets/Untitled design (1).pdf (3).jpg" class="movie__img" alt="">
      </div>
    </section>
  </body>
</html>
